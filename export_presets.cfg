; Presets de exportación. Ver docs/INSTALAR_MAC.md.
[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="tests/*, tools/*, docs/*, build/*"
export_path="build/Dinastia_macOS.zip"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=1
binary_format/architecture="universal"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
application/icon="res://icon.icns"
application/icon_interpolation=4
application/bundle_identifier="com.sebastian.dinastia"
application/signature=""
application/app_category="Simulation-games"
application/short_version="0.10.1"
application/version="0.10.1"
application/copyright="Sebastián Cuadros"
application/min_macos_version="10.13"
application/export_angle=0
display/high_res=true
; 1 = firma ad-hoc incorporada (sin cuenta de desarrollador): necesaria para que corra en Apple Silicon.
codesign/codesign=1
codesign/installer_identity=""
codesign/apple_team_id=""
codesign/identity=""
codesign/entitlements/custom_file=""
codesign/entitlements/allow_jit_code_execution=false
codesign/entitlements/allow_unsigned_executable_memory=false
codesign/entitlements/allow_dyld_environment_variables=false
codesign/entitlements/disable_library_validation=false
codesign/entitlements/audio_input=false
codesign/entitlements/camera=false
codesign/entitlements/location=false
codesign/entitlements/address_book=false
codesign/entitlements/calendars=false
codesign/entitlements/photos_library=false
codesign/entitlements/apple_events=false
codesign/entitlements/debugging=false
codesign/entitlements/app_sandbox/enabled=false
codesign/custom_options=PackedStringArray()
notarization/notarization=0

