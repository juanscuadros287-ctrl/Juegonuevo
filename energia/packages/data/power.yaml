# Fase 5: mercado eléctrico por país (parque existente agregado, demanda horaria, clima, capacidad y servicios).
# El precio spot horario = costo marginal de la unidad marginal (merit order) en días representativos:
# 12 meses × {laborable, fin de semana} × 24 h. Ver docs/MOTOR_FASE5.md.
# El parque existente se deriva de `mercado.matriz` (participación en la generación) y de `mercado.demanda_anual_twh`
# de cada país, salvo que `parque_mw` lo fije. Los costos marginales térmicos se calibran (un factor por país) para que el
# spot medio del año base sin plantas de los actores sea el `precio_spot_medio_usd_mwh` histórico del país.

