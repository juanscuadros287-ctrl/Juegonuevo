# Clientes y oportunidades (Fase 3). Cada tipo genera oportunidades con frecuencia de Poisson (por año).
# precio_referencia: USD/MWh (ppa, bot), USD/kW-mes de potencia firme (potencia), USD/kW instalado (epc), en 2026.
# El precio de referencia sigue al mercado (costo de equipos e inflación) a lo largo de la partida.
# precio_reserva_factor: lo máximo que acepta el cliente = referencia × factor (público si publica_precio_tope).
# pesos: evaluación por puntaje (precio + técnica + experiencia/reputación + plazo); suman 1.
# tipo_contrato: nodo de I+D (research.yaml) que habilita ofertar.

garantias:
  comision_anual: 0.015
  colateral_frac: 0.5
  supuesto: "Fianzas de oferta y cumplimiento en Panamá: comisión ≈ 1–2 %/año; a una empresa sin historial el banco le pide ≈ 50 % de colateral en efectivo"

jugador:
  reputacion_inicial: 25
  experiencia_mw_inicial: 0
  supuesto: "Empresa nueva: sin plantas construidas y poca reputación (escala 0–100)"

potencia_firme_frac: { solar_fv: 0.05, eolica_tierra: 0.20, baterias: 0.95, hidro_embalse: 0.90, gas_natural: 0.95, hidro_bombeo: 0.95, geotermica: 0.90, carbon: 0.90, petroleo: 0.90, nuclear: 0.92, smr: 0.92, biomasa: 0.80, csp: 0.60, hidro_pasada: 0.40, eolica_marina: 0.30 }
potencia_firme_fuente: "Potencia firme reconocida por tecnología, orden de magnitud de la metodología de ASEP/CND (Reglas Comerciales del Mercado Mayorista de Panamá); supuesto"

epc:
  anticipo_frac: 0.10
  retencion_frac: 0.10
  ld_frac_semana: 0.005
  ld_tope_frac: 0.10
  contingencia_frac: 0.05
  fuente: "Condiciones típicas FIDIC Silver Book: anticipo 10 %, retención 5–10 %, daños por atraso 0,5 %/semana con tope del 10 %"

meses_asignar_proyecto: 9

tipos:
  - id: etesa_energia
    nombre: Licitación de energía de largo plazo (ETESA)
    pais: PAN
    tipo: licitacion_publica
    contrato: ppa
    tipo_contrato: ppa_simple
    descripcion: "ETESA compra bloques de energía para las distribuidoras (ENSA, Naturgy). Precio tope publicado; gana el mejor puntaje, sobre todo por precio."
    nombres_cliente: ["ETESA – LPI de energía renovable", "ETESA – Licitación de largo plazo", "ETESA – Bloque de energía para distribuidoras"]
    frecuencia_anual: 2
    mw: { min: 10, base: 30, max: 80, supuesto: "Bloques adjudicados por oferente en las LPI de ETESA 2020–2024 (orden de magnitud)" }
    plazo_anos: { min: 10, base: 15, max: 20, supuesto: "Contratos de 10–20 años" }
    tecnologias: [solar_fv, eolica_tierra, hidro_pasada, biomasa, geotermica, biogas]
    precio_referencia: { min: 55, base: 66, max: 80, supuesto: "Precios adjudicados a renovables en licitaciones de ETESA 2020–2024 ≈ 55–90 USD/MWh" }
    precio_reserva_factor: { min: 1.0, base: 1.1, max: 1.25, supuesto: "Precio tope ≈ 10–20 % sobre la referencia" }
    publica_precio_tope: true
    plazo_oferta_dias: { min: 60, base: 90, max: 120, supuesto: "Pliego publicado 2–4 meses antes" }
    evaluacion_dias: { min: 30, base: 45, max: 75, supuesto: "Evaluación y adjudicación" }
    plazo_cod_meses: { min: 24, base: 30, max: 36, supuesto: "Inicio de suministro 2–3 años después" }
    garantia_seriedad_usd_mw: 10000
    garantia_cumplimiento_usd_mw: 50000
    pesos: { precio: 0.6, tecnica: 0.15, experiencia: 0.15, plazo: 0.1 }
    experiencia_mw_min: 0
    capital_min_usd: 0
    multa_usd_mw_mes: 1500
    meses_max_atraso: 12
    costo_preparacion_usd: { min: 25000, base: 35000, max: 60000, supuesto: "Pliego, asesoría legal, modelo y visita técnica" }
    ofertantes_externos: { media: 2.5, precio_factor: { min: 0.9, base: 1.04, max: 1.25, supuesto: "Dispersión de ofertas en licitaciones latinoamericanas ≈ ±15 %" } }
