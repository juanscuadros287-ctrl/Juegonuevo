  - id: estudio_sitio_nuclear
    nombre: Caracterización del sitio nuclear (sismicidad, hidrogeología, emergencias)
    grupo: sitio_nuclear
    descripcion: "Estudios de sitio exigidos por el regulador nuclear (IAEA SSR-1): sismicidad, inundaciones, plan de emergencias."
    aplica: { tecnologias: [nuclear, smr] }
    requiere: [prefactibilidad]
