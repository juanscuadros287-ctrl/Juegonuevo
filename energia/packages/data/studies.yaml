    requiere: []
    costo_fijo_usd: { min: 8000, base: 12000, max: 20000, supuesto: "Informe satelital de DNI" }
    costo_usd_mw: { base: 100, supuesto: "Modelación" }
    duracion_dias: { min: 20, base: 30, max: 60, supuesto: "Compra de datos" }
    sigma_recurso: 0.07
    resultados: { normal: 1, peor: 0, bloqueo: 0, fuente: "Incertidumbre satelital del DNI anual ±6–9 % (Solargis 2023)" }

  - id: medicion_dni_estacion
    nombre: Estación de DNI en sitio (12 meses)
    grupo: medicion_recurso
    descripcion: "Pirheliómetro con seguidor durante un año, correlacionado con la serie satelital. Bancable."
