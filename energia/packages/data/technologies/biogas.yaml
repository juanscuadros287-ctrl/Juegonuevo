# Digestores anaerobios con motores de gas (residuos agroindustriales, estiércol, rellenos).
id: biogas
nombre: Biogás
categoria: bioenergia
recurso: biomasa
recurso_tipico: 1800
modelo_fc: termica
visual: biogas

