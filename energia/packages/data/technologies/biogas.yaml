om_variable_usd_mwh: { min: 8, base: 12, max: 20, supuesto: "Mantenimiento de motores por hora de uso" }
factor_capacidad_ref: { min: 0.34, base: 0.85, max: 0.85, supuesto: "Disponibilidad máxima; el despacho real depende del margen sobre el costo marginal" }
vida_util_anos: { min: 15, base: 20, max: 25, supuesto: "Motores con overhaul" }
degradacion_anual: { min: 0.001, base: 0.002, max: 0.005, supuesto: "Pérdida de eficiencia entre mantenimientos mayores" }
construccion_meses: { min: 8, base: 12, max: 18, supuesto: "Plantas modulares" }
puesta_en_marcha_dias: { min: 30, base: 60, max: 120, supuesto: "Pruebas de desempeño" }
emisiones_gco2_kwh: { min: 10, base: 30, max: 80, supuesto: "Metano evitado vs fugas (IPCC)" }
uso_suelo_ha_mw: { min: 0.3, base: 0.8, max: 2, supuesto: "Digestores y lagunas" }
