variabilidad: { diaria: 0.02, interanual: 0.01, supuesto: "Sin recurso variable" }

fallas:
  eventos_ano_por_mw: { min: 0.005, base: 0.01, max: 0.03, supuesto: "Pilas y compresores" }
  fraccion_afectada: { min: 0.05, base: 0.15, max: 0.5, supuesto: "Un módulo" }
  duracion_dias: { min: 2, base: 10, max: 45, supuesto: "Repuestos" }
  costo_reparacion_usd_kw: { min: 10, base: 40, max: 150, supuesto: "Pilas" }
mantenimiento:
  programado_perdida: 0.02
  preventivo_om_factor: 1.05
  preventivo_fallas_factor: 0.6
  correctivo_om_factor: 0.95
  supuesto: "Mantenimiento de compresores"
costo_desmantelamiento_frac_capex: { min: 0.02, base: 0.04, max: 0.08, supuesto: "Retiro" }

estudios_requeridos: [prefactibilidad, factibilidad, eia, conexion]

hitos_construccion:
  - { id: obra_civil, nombre: "Obra civil", fraccion: 0.25, sensible_lluvia: true }
  - { id: electrolizadores, nombre: "Electrolizadores y compresión", fraccion: 0.55, requiere_equipos: true }
  - { id: pruebas, nombre: "Pruebas", fraccion: 0.2 }

riesgos:
  - { id: mercado, nombre: "Mercado del H2", descripcion: "Pocos compradores con contratos de largo plazo; precio de venta incierto." }
  - { id: electricidad, nombre: "Electricidad", descripcion: "El costo de la energía es ≈ 60–70 % del costo del H2." }

sitio:
  superficie: tierra
