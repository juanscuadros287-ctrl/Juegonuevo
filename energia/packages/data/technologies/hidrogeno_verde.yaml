om_variable_usd_mwh: { min: 0, base: 1, max: 2, supuesto: "Químicos" }
factor_capacidad_ref: { min: 0.3, base: 0.55, max: 0.8, supuesto: "Opera en las horas más baratas" }
vida_util_anos: { min: 15, base: 20, max: 25, supuesto: "Planta; pilas cada 60–80 mil horas (en O&M)" }
degradacion_anual: { min: 0.005, base: 0.008, max: 0.015, fuente: "IRENA 2020 (degradación de pilas ≈ 1 %/año)" }
