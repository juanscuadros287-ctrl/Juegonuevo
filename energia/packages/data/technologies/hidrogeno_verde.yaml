puesta_en_marcha_dias: { min: 30, base: 60, max: 120, supuesto: "Pruebas" }
emisiones_gco2_kwh: { base: 0, supuesto: "Depende de la electricidad usada" }
uso_suelo_ha_mw: { min: 0.02, base: 0.05, max: 0.1, supuesto: "Planta compacta" }
