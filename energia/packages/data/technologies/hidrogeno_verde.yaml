# Hidrógeno verde: electrolizador conectado a la red comprando energía en horas baratas; vende H2.
id: hidrogeno_verde
nombre: Hidrógeno verde
categoria: hidrogeno
modelo_fc: hidrogeno
visual: hidrogeno

capex_usd_kw: { min: 1200, base: 2000, max: 3000, fuente: "IEA Global Hydrogen Review 2024: electrolizador instalado ≈ 2.000 USD/kW fuera de China (1.700–2.500)" }
desglose_capex: { equipos: 0.55, epc: 0.3, otros: 0.15, supuesto: "Pilas y balance de planta ≈ 55 %" }
