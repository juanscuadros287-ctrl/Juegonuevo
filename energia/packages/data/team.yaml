  pt: { nombres: [João, Ana, Pedro, Mariana, Lucas, Beatriz, Rafael, Camila, Gustavo, Larissa, Thiago, Fernanda, Bruno, Juliana], apellidos: [Silva, Santos, Oliveira, Souza, Lima, Pereira, Costa, Ferreira, Almeida, Carvalho, Ribeiro, Barbosa] }
  en: { nombres: [James, Mary, John, Grace, Michael, Faith, David, Joy, Daniel, Mercy, Paul, Sarah, Kevin, Emily, Mark, Ruth], apellidos: [Smith, Johnson, Brown, Otieno, Kamau, Wanjiru, Reyes, Santos, Garcia, Walker, Mwangi, Bautista, Miller, Davis, Ochieng, Mendoza] }
  is: { nombres: [Jón, Guðrún, Sigurður, Anna, Gunnar, Kristín, Ólafur, Helga, Einar, Sigríður], apellidos: [Jónsson, Sigurðardóttir, Guðmundsson, Jónsdóttir, Einarsson, Ólafsdóttir, Magnússon, Stefánsdóttir] }
  id: { nombres: [Budi, Siti, Agus, Dewi, Rizky, Putri, Hendra, Ayu, Andi, Rina], apellidos: [Santoso, Wijaya, Saputra, Hidayat, Kusuma, Pratama, Nugroho, Lestari] }

# Oficinas por país. Nivel 0 = presencia de la Fase 4 (representante legal). El país de origen arranca con oficina local
# (su costo ya está en los gastos fijos de la empresa).
oficinas:
  niveles:
    - id: representante
      nombre: "Representante legal"
      capacidad_personal: 2
      costo_inicial_usd: 0
      costo_mensual_usd: 0
      dias: 0
      costo_desarrollo_frac: 0
      reputacion_gobierno_mes: 0
      invitaciones_privadas: false
      supuesto: "Sociedad y representante de la Fase 4 (sus costos están en countries/*.yaml → expansion)"
    - id: oficina
      nombre: "Oficina local"
      capacidad_personal: 15
      costo_inicial_usd: 60000
      costo_mensual_usd: 9000
      dias: 60
      costo_desarrollo_frac: -0.05
      reputacion_gobierno_mes: 0.25
      invitaciones_privadas: true
      supuesto: "Arriendo 150–250 m², recepción, contador y TI (× índice del país); estudios y permisos −5 % por proveedores locales"
    - id: sede
      nombre: "Sede regional"
      capacidad_personal: 45
      costo_inicial_usd: 250000
      costo_mensual_usd: 32000
      dias: 120
      costo_desarrollo_frac: -0.08
      reputacion_gobierno_mes: 0.4
      invitaciones_privadas: true
      costo_desarrollo_vecinos_frac: -0.03
      supuesto: "Oficina de 600–1.000 m² con dirección regional, legal, finanzas y compras compartidas; −3 % en los países vecinos de la región"
  requisitos_sede: { personal_min: 4, supuesto: "Sin masa crítica de personal no hay sede regional" }
  regiones:
    centroamerica_caribe: [PAN, CRI, DOM, MEX]
    sudamerica: [COL, CHL, BRA]
    norteamerica: [USA, MEX]
    europa: [ESP, ISL]
    africa_oriental: [KEN]
    sudeste_asiatico: [IDN, PHL]

reputacion:
  inicial_pais_nuevo: { base: 30, supuesto: "Empresa desconocida en un país nuevo" }
  reversion_mensual: { base: 0.01, supuesto: "La reputación vuelve 1 %/mes hacia el valor neutro (memoria institucional limitada)" }
  neutro: { base: 40, supuesto: "Valor al que tiende sin noticias" }
  # Cambios por causa (puntos sobre 100).
  causas:
    obra_a_tiempo: { gobierno: 2, comunidad: 1, clientes: 1 }
    obra_atrasada: { gobierno: -1, clientes: -1 }
    permiso_aprobado: { gobierno: 0.3 }
    permiso_rechazado: { gobierno: -1 }
    abandono: { gobierno: -2, comunidad: -2 }
    abandono_en_obra: { gobierno: -5, comunidad: -4, clientes: -3 }
    conflicto: { comunidad: -6, gobierno: -1 }
    accidente: { gobierno: -3, comunidad: -3 }
    multa: { clientes: -1 }
    inversion_social: { comunidad: 1 }
    planta_operando_anual: { comunidad: 0.5, gobierno: 0.3 }
    despido_masivo: { gobierno: -1 }
  supuesto: "Magnitudes relativas de juego; dirección según la literatura de licencia social (Prno & Slocombe 2012)"
  # Efectos (multiplicador = 1 + k·(reputación − 50)/50, acotado):
  efectos:
    social_aprobacion: { base: 0.15, supuesto: "Consulta y licencia social ±15 %" }
    conflicto: { base: 0.5, supuesto: "Probabilidad de conflicto ∓50 %" }
    banca_desarrollo_spread: { base: 0.2, supuesto: "Bancos de desarrollo: spread ∓20 % según la relación con el gobierno" }
    invitacion_prob_mes: { base: 0.04, supuesto: "Con oficina y clientes ≥ 50: hasta 4 %/mes de solicitud privada directa por país" }
  inversion_social:
    usd_por_punto: { base: 40000, supuesto: "Programas comunitarios (becas, agua, caminos): ~40 kUSD por punto, rendimiento decreciente" }
    tope_anual_puntos: { base: 15, supuesto: "No se compra la confianza: tope anual" }

# Riesgos de obra que dependen del equipo social, la reputación y la supervisión.
riesgos_obra:
  conflicto_mensual: { base: 0.012, supuesto: "≈ 14 %/año de conflicto comunitario en obra con reputación neutra y sin equipo social (Davis & Franks 2014)" }
  conflicto_dias: { min: 15, base: 45, max: 150, supuesto: "Bloqueos y paros por conflicto" }
  conflicto_costo_frac: { min: 0.002, base: 0.008, max: 0.03, supuesto: "Costos de negociación, seguridad y compensaciones (fracción del presupuesto)" }
  accidente_mensual: { base: 0.003, supuesto: "≈ 3,5 %/año de accidente grave por obra grande" }
  accidente_dias: { min: 5, base: 20, max: 60, supuesto: "Paro e investigación" }
  accidente_costo_frac: { min: 0.001, base: 0.003, max: 0.01, supuesto: "Multas, indemnizaciones y reparaciones" }

# Equipo inicial del jugador (integra el «fundador + 2 técnicos» de los gastos fijos de game.yaml).
equipo_inicial_jugador:
  - { rol: ing_recurso, habilidad: 48, experiencia: 6 }
  - { rol: gerente_proyecto, habilidad: 45, experiencia: 9 }

# La IA arma su equipo con la misma lógica (contrata del mercado laboral con los mismos comandos).
ia:
  equipo_inicial:
    agresiva: [{ rol: comercial, habilidad: 60, experiencia: 10 }, { rol: financiero, habilidad: 55, experiencia: 8 }, { rol: gerente_proyecto, habilidad: 50, experiencia: 9 }]
    conservadora: [{ rol: gerente_proyecto, habilidad: 62, experiencia: 15 }, { rol: ing_electrico, habilidad: 60, experiencia: 14 }, { rol: abogado, habilidad: 55, experiencia: 12 }]
    estatal: [{ rol: abogado, habilidad: 65, experiencia: 16 }, { rol: social, habilidad: 60, experiencia: 12 }, { rol: gerente_proyecto, habilidad: 58, experiencia: 14 }, { rol: ing_electrico, habilidad: 60, experiencia: 15 }]
    fondo: [{ rol: financiero, habilidad: 70, experiencia: 14 }, { rol: analista, habilidad: 60, experiencia: 8 }]
    especialista: [{ rol: ing_recurso, habilidad: 62, experiencia: 9 }, { rol: geologo, habilidad: 58, experiencia: 10 }, { rol: comercial, habilidad: 50, experiencia: 6 }]
  # Roles que cada estrategia busca, en orden; uno por cada `por_proyectos` proyectos activos.
  objetivos:
    agresiva: { roles: [comercial, financiero, gerente_proyecto, abogado, ing_civil], por_proyectos: 2, max: 9 }
    conservadora: { roles: [gerente_proyecto, ing_electrico, abogado, ing_recurso, financiero], por_proyectos: 2, max: 8 }
    estatal: { roles: [abogado, social, gerente_proyecto, ing_electrico, ing_civil], por_proyectos: 2, max: 10 }
    fondo: { roles: [financiero, analista, ing_electrico, gerente_proyecto], por_proyectos: 3, max: 6 }
    especialista: { roles: [ing_recurso, geologo, comercial, gerente_proyecto, abogado], por_proyectos: 2, max: 8 }
  supuesto: "Equipos de 2–10 personas para desarrolladores medianos; el costo de estas personas se descontó de los gastos fijos de competitors.yaml"
