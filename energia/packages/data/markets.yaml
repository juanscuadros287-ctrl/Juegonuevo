  - { id: biomasa, nombre: "Biomasa (residuos agroforestales)", precio_usd_mmbtu: { base: 2.5, min: 1.0, max: 5.0, fuente: "IRENA Biomass for Power Generation (2012) y IEA Bioenergy 2023: residuos 1–3 USD/GJ en el lugar" },
