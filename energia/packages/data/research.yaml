  - { id: tec_eolica_tierra, nombre: "Eólica en tierra", rama: tecnologias, descripcion: "Conocimiento inicial de la empresa.", costo_usd: 0, meses: 1, requiere: [], inicial: true, prob_contratiempo: 0, efectos: { tecnologias: [eolica_tierra] }, supuesto: "Punto de partida" }
