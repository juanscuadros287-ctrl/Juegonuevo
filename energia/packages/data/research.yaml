# Árbol de investigación y desarrollo (I+D). Fase 3.
# Cada nodo: costo total (USD), duración mínima (meses, con presupuesto suficiente), prerrequisitos y efectos.
# El avance diario = min(1/duración, presupuesto mensual/costo): con poco presupuesto tarda más.
# prob_contratiempo: al terminar, chance de volver 10–30 % atrás (una vez).
# Efectos: fracciones relativas (−0,05 = −5 %); clave '*' = todas las tecnologías.
# fase_modelo: lo que desbloquea aún no tiene modelo completo (llega en esa fase). Desde la Fase 4 ningún nodo lo usa.
supuesto_general: "Costos y plazos de I+D supuestos para el juego: equipos de 2–8 personas (≈ 6–12 kUSD/mes por persona en la región) más pilotos, licencias y certificaciones. Efectos en el rango de mejoras documentadas por NREL ATB 2024 e IRENA 2023."

